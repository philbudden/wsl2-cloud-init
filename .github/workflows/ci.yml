name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-render:
    name: Static checks and cloud-init rendering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloud-init shellcheck

      - name: Check Bash formatting and syntax
        run: |
          shellcheck scripts/*.sh tests/*.sh
          bash -n scripts/*.sh tests/*.sh

      - name: Run focused Bash tests
        run: |
          sudo ./tests/bootstrap-failure-test.sh
          sudo ./tests/validate-test.sh

      - name: Render and validate cloud-init configuration
        shell: pwsh
        run: ./tests/setup.Tests.ps1

  bootstrap-integration:
    name: Bootstrap integration and rerun validation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: static-and-render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cloud-init validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloud-init

      - name: Provision and validate twice in a disposable runner
        run: sudo env WSL_BOOTSTRAP_TEST_DISPOSABLE=1 ./tests/bootstrap-integration-test.sh
